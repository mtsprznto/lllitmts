# pnpm 11+ reads settings ONLY from pnpm-workspace.yaml
# (the "pnpm" field in package.json is ignored since pnpm 11).
# See https://pnpm.io/settings
#
# ⚠️ js-yaml: keep it below 5.x. js-yaml 5 is an ESM rewrite with named
# exports only (NO default export), and astro 7 does `import yaml from "js-yaml"`.
# The previous `>=4.3.1` (no upper bound) resolved to 5.2.3 and broke `astro dev`
# with "The requested module 'js-yaml' does not provide an export named 'default'".
overrides:
  esbuild: '>=0.28.1'
  brace-expansion: '>=5.0.9'
  js-yaml: '>=4.3.1 <5'
  postcss: '>=8.5.23'
  sharp: '>=0.35.0'
  tar: '>=7.5.21'
